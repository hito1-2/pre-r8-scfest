<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文化祭会計システム(試作 with AI)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>R8 文化祭 会計レジ(試作 with AI)</h1>
        <p>
            確認用：<a href="https://docs.google.com/spreadsheets/d/18BsQaiyHCnNE8SpnwPJP4gDF_SKURpKJZSKtQrdHwqQ/edit?usp=sharing">→ここをクリックして注文を確認←</a>(試作なので編集できない設定にしてますが、本番環境ではレ点チェックが押せます)
        </p>
        
        <!-- メニュー一覧表示エリア -->
        <div id="menu-container" class="menu-list">
            <!-- JavaScriptによりメニューカードが自動生成されます -->
        </div>

        <!-- 合計金額および操作エリア -->
        <div class="summary-section">
            <div class="total-display">
                <span>合計金額:</span>
                <span id="total-amount">0</span> 円
            </div>
            
            <div class="button-group">
                <button id="reset-btn" type="button" class="btn btn-secondary">リセット</button>
                <button id="submit-btn" type="button" class="btn btn-primary">注文送信</button>
            </div>
            
            <!-- 送信ステータス表示 -->
            <p id="status-message" class="status-message"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
