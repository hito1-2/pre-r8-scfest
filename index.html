<!-- ========================================

<div id="password-overlay" class="password-overlay">

        <h2 class="password-popup-title">

        >

            id="password-submit"
            class="password-popup-button"

            認証

    </div>

</div>

<div class="container">

<!-- ========================================
     パスワード認証処理
     ======================================== -->

<script>

    /*
     * パスワード
     *
     * 必要に応じてここを変更してください。
     */
    const password = "test";


    const passwordOverlay =
        document.getElementById("password-overlay");

    const passwordInput =
        document.getElementById("password-input");

    const passwordSubmit =
        document.getElementById("password-submit");


    /*
     * 認証処理
     */
    function authenticate() {

        /*
         * 正しいパスワード
         */
        if (passwordInput.value === password) {

            /*
             * パスワード画面を非表示
             */
            passwordOverlay.style.display = "none";


            /*
             * 会計システムを表示
             */
            const container =
                document.querySelector(".container");

            if (container) {
                container.style.display = "block";
            }

            return;
        }


        /*
         * 間違ったパスワード
         *
         * body全体を401ページに置き換える。
         */
        document.body.innerHTML = `
            <div class="unauthorized-page">
                <h1>401 Unauthorized</h1>
                <p>パスワードが違います</p>
            </div>
        `;

    }


    /*
     * 「認証」ボタン
     */
    passwordSubmit.addEventListener(
        "click",
        authenticate
    );


    /*
     * Enterキーでも認証
     */
    passwordInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {
                authenticate();
            }

        }
    );


    /*
     * ページ読み込み後、
     * パスワード入力欄にフォーカス
     */
    window.addEventListener(
        "load",
        function () {

            passwordInput.focus();

        }
    );

</script>

     メインJavaScript
     ======================================== -->

<script src="script.js"></script>
