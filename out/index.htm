<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文化祭 厨房・受渡モニター</title>
  <script>
  // ★デプロイしたWebアプリのURL
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxJk1q9uBGcmb7N00EGJTLUKHk5QRSjyrBgYYloPVnXFgxdMPGOarhCQVlf-xQI7e9BWQ/exec';

  // 定期更新の間隔 (10秒)
  const AUTO_REFRESH_INTERVAL = 10000;

  // 通信中フラグ（更新処理中に自動更新が割り込むのを防ぐ）
  let isUpdating = false;

  window.onload = () => {
    fetchOrders();
    // 定期更新（更新処理中でない場合のみ実行）
    setInterval(() => {
      if (!isUpdating) {
        fetchOrders();
      }
    }, AUTO_REFRESH_INTERVAL);
  };

  // 注文データ一覧の取得
  async function fetchOrders() {
    // 他の更新処理中は自動取得を行わない
    if (isUpdating) return;

    const container = document.getElementById('orderContainer');
    try {
      const response = await fetch(GAS_API_URL);
      if (!response.ok) {
        throw new Error(`HTTPエラー ステータス: ${response.status}`);
      }
      
      const result = await response.json();

      if (result.status === 'success') {
        renderOrders(result.orders);
      } else {
        container.innerHTML = `
          <div style="color: red; padding: 20px; background: #fff; border: 2px solid red; border-radius: 8px; grid-column: 1/-1;">
            <h3>GAS実行エラーが発生しました</h3>
            <p>${result.message}</p>
          </div>`;
      }
    } catch (error) {
      container.innerHTML = `
        <div style="color: red; padding: 20px; background: #fff; border: 2px solid red; border-radius: 8px; grid-column: 1/-1;">
          <h3>データの取得に失敗しました</h3>
          <p>${error.message}</p>
        </div>`;
      console.error('Fetch Error:', error);
    }
  }

  // 画面への描画処理
  function renderOrders(orders) {
    const container = document.getElementById('orderContainer');
    
    if (!orders || orders.length === 0) {
      container.innerHTML = '<p>現在表示する未完了の注文はありません。</p>';
      return;
    }

    container.innerHTML = '';

    orders.forEach(order => {
      const card = document.createElement('div');
      card.className = `order-card ${order.orderChecked ? 'ordered' : ''}`;
      card.id = `card-${order.rowIndex}`; // カード特定用のID設定
      
      const itemsHtml = order.items
        .filter(item => item.quantity > 0)
        .map(item => `
          <li>
            <span>${item.name}</span>
            <span class="item-quantity">× ${item.quantity}</span>
          </li>
        `).join('');

      card.innerHTML = `
        <div class="card-header">
          <span>行番号: #${order.rowIndex}</span>
          <span>${order.timestamp}</span>
        </div>
        <ul class="item-list">
          ${itemsHtml}
        </ul>
        <div class="card-footer">
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" class="chk-order"
                ${order.orderChecked ? 'checked' : ''} 
                onchange="toggleCheck(${order.rowIndex}, 'order', this)">
              注文確認
            </label>
            <label class="checkbox-label">
              <input type="checkbox" class="chk-delivery"
                ${order.deliveryChecked ? 'checked' : ''} 
                onchange="toggleCheck(${order.rowIndex}, 'delivery', this)">
              受渡確認
            </label>
          </div>
          <div class="total-price">¥${order.totalAmount}</div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  // チェックボックス変更時のスプレッドシート更新処理
  async function toggleCheck(rowIndex, target, checkboxElem) {
    const cardElem = document.getElementById(`card-${rowIndex}`);
    const checkboxes = cardElem.querySelectorAll('input[type="checkbox"]');

    // 1. 通信中は他の操作を制限し、連打・割り込みを防ぐ
    isUpdating = true;
    checkboxes.forEach(chk => chk.disabled = true);

    const isChecked = checkboxElem.checked;

    try {
      const payload = {
        action: 'updateCheck',
        rowIndex: rowIndex,
        target: target,
        value: isChecked
      };

      // 2. GASへ書き込みリクエスト送信
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status !== 'success') {
        throw new Error(result.message);
      }

      // 3. スプレッドシート側の反映完了をわずかに待つ (400ms)
      await new Promise(resolve => setTimeout(resolve, 400));

    } catch (error) {
      alert('状態の更新に失敗しました。元の表示に戻します。');
      console.error('Update Error:', error);
      // エラー時はチェック状態を元に戻す
      checkboxElem.checked = !isChecked;
    } finally {
      // 4. 通信ロック解除＆チェックボックス有効化
      isUpdating = false;
      checkboxes.forEach(chk => chk.disabled = false);

      // 5. 最新状態に画面を再描画（両方チェックなら消える）
      fetchOrders();
    }
  }
</script>
</body>
</html>
