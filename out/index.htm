<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文化祭 厨房・受渡モニター</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { margin: 0; color: #333; }
    .btn-refresh {
      padding: 10px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-refresh:hover { background-color: #0056b3; }
    
    /* 注文カード一覧のグリッド配置 */
    .order-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .order-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 16px;
      border-left: 6px solid #ffc107; /* 未処理: 黄色 */
      transition: all 0.3s ease;
    }
    .order-card.ordered {
      border-left-color: #17a2b8; /* 注文確認済み: 青色 */
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-size: 0.85em;
      color: #666;
    }
    .item-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }
    .item-list li {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #f0f0f0;
      font-size: 1.1em;
    }
    .item-quantity {
      font-weight: bold;
      color: #d9534f;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
      padding: 10px;
      border-radius: 6px;
    }
    .checkbox-group {
      display: flex;
      gap: 12px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .checkbox-label input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .total-price {
      font-weight: bold;
      font-size: 1.1em;
      color: #333;
    }
  </style>
</head>
<body>

  <header>
    <h1>注文・受渡管理モニター</h1>
    <button class="btn-refresh" onclick="fetchOrders()">最新状態に更新</button>
  </header>

  <div id="orderContainer" class="order-grid">データを読み込み中...</div>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxJk1q9uBGcmb7N00EGJTLUKHk5QRSjyrBgYYloPVnXFgxdMPGOarhCQVlf-xQI7e9BWQ/exec';

    // 音声ファイルの読み込み
    const soundSuccess = new Audio('../success.wav');
    const soundError = new Audio('../error.wav');

    const AUTO_REFRESH_INTERVAL = 10000; // 10秒
    let isUpdating = false;

    window.onload = () => {
      fetchOrders();
      setInterval(() => {
        if (!isUpdating) {
          fetchOrders();
        }
      }, AUTO_REFRESH_INTERVAL);
    };

    // 成功音を鳴らす関数
    function playSuccessSound() {
      soundSuccess.currentTime = 0; // 連続再生用リセット
      soundSuccess.play().catch(err => console.warn('音声再生がブロックされました:', err));
    }

    // エラー音を鳴らしてからポップアップを出す関数（Chromeブロック対策）
    function showErrorWithSound(message) {
      soundError.currentTime = 0;
      soundError.play().catch(err => console.warn('音声再生がブロックされました:', err));

      // Chrome等でalert()が音声を止めてしまわないよう、100ms遅らせてアラートを表示
      setTimeout(() => {
        alert(message);
      }, 100);
    }

    // 注文データ一覧の取得
    async function fetchOrders() {
      if (isUpdating) return;

      const container = document.getElementById('orderContainer');
      try {
        const response = await fetch(GAS_API_URL);
        if (!response.ok) {
          throw new Error(`HTTPエラー ステータス: ${response.status}`);
        }
        
        const result = await response.json();

        if (result.status === 'success') {
          renderOrders(result.orders);
        } else {
          showErrorWithSound(`エラーが発生しました:\n${result.message}`);
        }
      } catch (error) {
        showErrorWithSound(`データの取得に失敗しました:\n${error.message}`);
        console.error('Fetch Error:', error);
      }
    }

    // 画面への描画処理
    function renderOrders(orders) {
      const container = document.getElementById('orderContainer');
      
      if (!orders || orders.length === 0) {
        container.innerHTML = '<p>現在表示する未完了の注文はありません。</p>';
        return;
      }

      container.innerHTML = '';

      orders.forEach(order => {
        const card = document.createElement('div');
        card.className = `order-card ${order.orderChecked ? 'ordered' : ''}`;
        card.id = `card-${order.rowIndex}`;
        
        const itemsHtml = order.items
          .filter(item => item.quantity > 0)
          .map(item => `
            <li>
              <span>${item.name}</span>
              <span class="item-quantity">× ${item.quantity}</span>
            </li>
          `).join('');

        card.innerHTML = `
          <div class="card-header">
            <span>行番号: #${order.rowIndex}</span>
            <span>${order.timestamp}</span>
          </div>
          <ul class="item-list">
            ${itemsHtml}
          </ul>
          <div class="card-footer">
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" class="chk-order"
                  ${order.orderChecked ? 'checked' : ''} 
                  onchange="toggleCheck(${order.rowIndex}, 'order', this)">
                注文確認
              </label>
              <label class="checkbox-label">
                <input type="checkbox" class="chk-delivery"
                  ${order.deliveryChecked ? 'checked' : ''} 
                  onchange="toggleCheck(${order.rowIndex}, 'delivery', this)">
                受渡確認
              </label>
            </div>
            <div class="total-price">¥${order.totalAmount}</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // チェックボックス変更時の処理
    async function toggleCheck(rowIndex, target, checkboxElem) {
      const cardElem = document.getElementById(`card-${rowIndex}`);
      const checkboxes = cardElem.querySelectorAll('input[type="checkbox"]');

      isUpdating = true;
      checkboxes.forEach(chk => chk.disabled = true);

      const isChecked = checkboxElem.checked;

      try {
        const payload = {
          action: 'updateCheck',
          rowIndex: rowIndex,
          target: target,
          value: isChecked
        };

        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status !== 'success') {
          throw new Error(result.message);
        }

        // 成功音を鳴らす
        playSuccessSound();

        // 反映待ち (400ms)
        await new Promise(resolve => setTimeout(resolve, 400));

      } catch (error) {
        checkboxElem.checked = !isChecked; // 元に戻す
        showErrorWithSound(`状態の更新に失敗しました:\n${error.message}`);
        console.error('Update Error:', error);
      } finally {
        isUpdating = false;
        checkboxes.forEach(chk => chk.disabled = false);
        fetchOrders();
      }
    }
  </script>
</body>
</html>
